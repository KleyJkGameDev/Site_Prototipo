<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="/style/cad.css">
</head>
<body>

    <form action="get" class="btn-gradient">
        <img src="/image/logotipo.png" alt="logo do IFMA">

        <label for="">Nome: </label>
        <input type="text" id="nome" class="area input"><br>

        <label for="">RG: </label>
        <input type="number" id="rg" class="area input"><br>

        <label for="">CPF: </label>
        <input type="number" id="cpf" value="x" max="11" required class="area input"><br>

        <label for="">Data de Nascimento: </label>
        <input type="date" id="data" class="area input"><br>

        <label for="">E-mail: </label>
        <input type="email" id="email" required class="area input"><br>
        <label for="">Senha: </label>
        <input type="password" id="senha" min="8" max="16" required class="area input"><br>

        <label for="">Sexo: </label><br>
        <input type="radio" name="sexo" value="Masculino">
        <label for="">Masculino </label>
        <input type="radio" name="sexo" value="Feminino">
        <label for="">Feminino </label>
        <br>
        
        <div id="area-radio">
            <label for="">Estado civil: </label><br>
            <input type="radio" name="civ" value="casado">
            <label for="">Casado(a) </label>
            <input type="radio" name="civ" value="solteiro">
            <label for="">Solteiro(a) </label>
            <input type="radio" name="civ" value="viuvo">
            <label for="">Viúvo(a) </label>
            <br>
        </div>

        <a href="/index/home.html"><input type="button" value="Cadastrar" class="buttom cad"></a>
        <input type="reset" value="Resetar" class="buttom reset">
        <a href="/index/login.html"><input type="button" value="Voltar" class="buttom login"></a>
           

    </form>
</body>
</html>
